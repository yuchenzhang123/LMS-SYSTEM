server:
  port: 8099
  shutdown: immediate

spring:
  lifecycle:
    timeout-per-shutdown-phase: 0s
  servlet:
    context-path: /
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  tomcat:
    # 限制Tomcat接受的最大请求体大小，超过则直接拒绝，快速返回错误
    max-swallow-size: 11MB
    max-http-form-post-size: 11MB
  error:
    include-message: always  # 确保错误消息被包含在响应中
    include-binding-errors: always
  application:
    name: rcrms-backend
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    com.bank.lms: info
    org.springframework: info

org:
  admin:
    # 管理员机构号，多个用英文逗号分隔，各环境在对应 yml 中覆盖
    codes: ""

auth:
  # 是否启用 Bearer Token 校验，开发环境设为 false 跳过
  enabled: true
  # OAuth2 check_token 端点，用于验证前端传来的 access_token
  token-check-url: ""

lms:
  log:
    archive:
      retention-years: 3  # 日志归档保留3年
  file:
    upload-path: file:./upload
    max-size: 10485760
    allowed-types:
      audio:
        - mp3
        - wav
        - aac
      image:
        - jpg
        - jpeg
        - png
        - gif
        - pdf
        - bmp
        - webp
      document:
        - pdf
        - doc
        - docx
        - txt
        - xlsx
        - xls
        - pptx
        - ppt
        - csv
        - rtf
        - zip
        - rar
        - 7z
      video:
        - mp4
        - avi
        - mov
        - wmv
        - flv
        - mkv
      archive:
        - zip
        - rar
        - 7z
        - tar
        - gz
  sms:
    enabled: false

  llm:
    # AI大模型总开关，默认关闭。启用需同时配置 api-key
    enabled: false
    # 模型提供商: openai / qwen（通义千问兼容OpenAI格式）
    provider: openai
    api-key: ${LLM_API_KEY:}
    api-url: https://api.openai.com/v1/chat/completions
    model: gpt-4o-mini
    # 最大输出token数（推理模型思考过程也消耗token，给足避免内容被思考耗尽）
    max-tokens: 8192
    # 推理模型默认思考开关（chat两参重载的默认值；各功能另有独立开关见下）
    enable-thinking: true
    # JSON 输出模式：prompt（仅 prompt 约束，最保守）| response_format（附加 response_format 参数）
    json-mode: prompt
    # 按功能独立控制思考模式：
    #   true = 开启思考（适合归因分析等多步推理场景，慢但更深入）
    #   false = 关闭思考（适合简报/摘要/分类等直出场景，省token提速）
    thinking:
      ask: true       # AI问答（归因分析）
      briefing: false # 每日简报
      summary: false  # 催收历程摘要
      intent: false   # 意图识别
    # 简报缓存（按用户数据范围隔离；主失效靠同步后清空，TTL 仅兜底防同步故障）
    cache:
      briefing-ttl-minutes: 1500
    # 多 provider 主备（可选）：配了 providers 列表则优先使用，主失败自动切备
    # providers:
    #   - api-url: https://api.openai.com/v1/chat/completions
    #     api-key: ${LLM_API_KEY:}
    #     model: gpt-4o-mini
    #     max-tokens: 4096
    #     enable-thinking: true
    #     json-mode: prompt
  ai:
    # NL2SQL 自由查询开关：false 时 /ai/chat 退化为纯 chat（不查库），便于一键回滚
    nl2sql-enabled: true
  # 向量模型（embedding）独立配置：知识库 RAG 召回用，与 lms.llm 解耦
  embedding:
    # 向量化总开关，默认关闭。启用需同时配置 api-key
    enabled: false
    # OpenAI 兼容 /embeddings 接口地址
    api-url: https://api.openai.com/v1/embeddings
    api-key: ${EMBEDDING_API_KEY:}
    # embedding 模型名（text-embedding-3-small / bge-m3 / qwen3-embedding 等）
    model: text-embedding-3-small
    # 召回 Top-K
    top-k: 5
    # 相似度阈值（余弦相似度），低于则不召回
    min-score: 0.0
    # 文本切块字符数（中文）
    chunk-size: 800
    # 切块重叠字符数
    chunk-overlap: 100
# 定时任务 cron 统一聚合配置（Spring 6 段式：秒 分 时 日 月 周）
scheduler:
  cron:
    user-org-sync: 0 15 6 * * ?      # 员工信息同步：每日 6:15
    gbase-sync: 0 0 6 * * ?          # GBase 每日同步：每日 6:00
    gbase-sync-retry: 0 0 12 * * ?   # GBase 同步兜底重试：每日 12:00
    log-archive: 0 0 2 1 * ?         # 日志归档：每月1号凌晨2点
