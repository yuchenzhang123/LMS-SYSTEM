# LLM 连通性测试专用配置
# 使用方式: mvn test -Dtest=LlmConnectivityTest -Dspring.profiles.active=llmtest

lms:
  llm:
    enabled: true
    provider: qwen
    # 内网千问 API（按实际地址修改）
    api-url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
    # API Key（按实际修改，或通过环境变量 LLM_API_KEY 注入）
    api-key: ${LLM_API_KEY:sk-your-key-here}
    model: qwen-plus
    timeout: 30000

# 测试不需要主数据源和 GBase，但 Spring Boot 启动需要基本配置
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
