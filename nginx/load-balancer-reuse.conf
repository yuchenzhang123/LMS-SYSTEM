# rcrms负载均衡配置（复用 Server 1 的 Nginx）
# 部署位置：Server 1 的 /etc/nginx/conf.d/lms-lb.conf
#
# 架构说明：
# - Server 1: Nginx 负载均衡器 + 本地前端 + 本地后端
# - Server 2: 前端 + 后端
# - 用户访问 Server 1，流量分发到 Server 1 和 Server 2

# 后端服务器池
upstream lms_backend {
    # 轮询策略（默认）
    # 本地后端（Server 1）
    server 127.0.0.1:8080 weight=1 max_fails=3 fail_timeout=30s;

    # 远程后端（Server 2）- 请修改为实际 IP
    server <SERVER2_IP>:8080 weight=1 max_fails=3 fail_timeout=30s;

    keepalive 32;
}

# 主服务器配置
server {
    listen 80;
    server_name lms.yourdomain.com;  # 修改为实际域名或 IP

    # 访问日志
    access_log /var/log/nginx/lms-access.log;
    error_log /var/log/nginx/lms-error.log;

    # 客户端请求体大小限制
    client_max_body_size 100M;

    # 前端静态资源（本地 dist）
    location / {
        root /var/www/lms/dist;  # 修改为实际前端 dist 路径
        try_files $uri $uri/ /index.html;
        index index.html;

        # Nginx 注入运行时变量（替代编译时写死）

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # 后端 API 接口（负载均衡）
    location /api/ {
        proxy_pass http://lms_backend;

        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # 禁用缓冲（实时响应）
        proxy_buffering off;

        # HTTP 1.1 支持
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 错误处理：自动切换到下一个服务器
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # WebSocket 支持（如果需要）
    location /ws/ {
        proxy_pass http://lms_backend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # 健康检查端点
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# HTTPS 配置（如果需要）
server {
    listen 443 ssl http2;
    server_name lms.yourdomain.com;

    # SSL 证书配置
    ssl_certificate /etc/nginx/ssl/lms.crt;
    ssl_certificate_key /etc/nginx/ssl/lms.key;

    # SSL 优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/lms-ssl-access.log;
    error_log /var/log/nginx/lms-ssl-error.log;

    client_max_body_size 100M;

    # 前端静态资源
    location / {
        root /var/www/lms/dist;
        try_files $uri $uri/ /index.html;
        index index.html;


        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # 后端 API 接口
    location /api/ {
        proxy_pass http://lms_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location /ws/ {
        proxy_pass http://lms_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
