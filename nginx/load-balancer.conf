# rcrms负载均衡配置（方案 A：独立 LB 服务器）
# 部署位置：负载均衡器服务器的 /etc/nginx/conf.d/lms-lb.conf
#
# 说明：后端端口已修正为 8099（与 application.yml 的 server.port 一致）。
# 若当前采用单机/生产部署（single-server.conf / production.conf），本配置为备选方案。

# 后端服务器池
upstream lms_backend {
    # 负载均衡策略：轮询（默认）
    # 其他可选策略：
    # - least_conn;  # 最少连接数
    # - ip_hash;     # IP 哈希（会话保持）

    # 服务器 1
    server 27.156.3.86:8099 weight=1 max_fails=3 fail_timeout=30s;

    # 服务器 2（请修改为实际 IP）
    server <SERVER2_IP>:8099 weight=1 max_fails=3 fail_timeout=30s;

    # 健康检查配置说明：
    # - max_fails=3: 失败 3 次后标记为不可用
    # - fail_timeout=30s: 30 秒后重新尝试
    # - weight=1: 权重（可调整分配比例）

    # 备用服务器（可选）
    # server <BACKUP_IP>:8099 backup;

    # 保持连接
    keepalive 32;
}

# 前端服务器池（如果前端也需要负载均衡）
upstream lms_frontend {
    server 27.156.3.86:80 weight=1 max_fails=3 fail_timeout=30s;
    server <SERVER2_IP>:80 weight=1 max_fails=3 fail_timeout=30s;

    keepalive 32;
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name lms.yourdomain.com;  # 修改为实际域名

    # 访问日志
    access_log /var/log/nginx/lms-lb-access.log;
    error_log /var/log/nginx/lms-lb-error.log;

    # 客户端请求体大小限制
    client_max_body_size 100M;

    # 健康检查端点（不重定向）
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 其余所有请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 服务器配置
server {
    listen 443 ssl http2;
    server_name lms.yourdomain.com;

    # SSL 证书配置
    ssl_certificate /etc/nginx/ssl/lms.crt;
    ssl_certificate_key /etc/nginx/ssl/lms.key;

    # SSL 协议
    ssl_protocols TLSv1.2 TLSv1.3;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 访问日志
    access_log /var/log/nginx/lms-lb-ssl-access.log;
    error_log /var/log/nginx/lms-lb-ssl-error.log;

    client_max_body_size 100M;

    # 前端静态资源
    location / {
        proxy_pass http://lms_frontend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering off;

        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # 后端 API 接口
    location /api/ {
        proxy_pass http://lms_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # WebSocket 支持
    location /ws/ {
        proxy_pass http://lms_backend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # OAuth2 令牌接口
    location /oauth/ {
        proxy_pass http://lms_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # SSO 认证服务
    location /ssoservice/ {
        proxy_pass http://lms_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
    }

    # 健康检查端点
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 状态监控（可选，需要 stub_status 模块）
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }
}
