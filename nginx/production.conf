#user  nobody;
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # rcrms 生产环境 Nginx 配置
    # 域名: rcrms.hi.bocsys.cn

    # HTTP → HTTPS 重定向
    server {
        listen 8080;
        server_name rcrms.hi.bocsys.cn;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS 主服务
    server {
        listen 443 ssl http2;
        server_name rcrms.hi.bocsys.cn;

        ssl_certificate /app/nginx/ssl/rcrms.crt;
        ssl_certificate_key /app/nginx/ssl/rcrms.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        access_log /app/nginx/logs/access.log;
        error_log /app/nginx/logs/error.log;

        location / {
            root /app/nginx/html/dist;
            index index.html;
            try_files $uri $uri/ /index.html;

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 7d;
                add_header Cache-Control "public, immutable";
            }
        }

        location /api/model/ {
            proxy_pass http://portal.hi.bocsys.cn/smc-rest-api-common-api/api/model/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/orginfo/ {
            proxy_pass http://portal.hi.bocsys.cn/smc-rest-api-common-api/api/orginfo/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8099/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ssoservice/ {
            proxy_pass http://portal.hi.bocsys.cn/sso-service/ssoservice/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header Set-Cookie;
        }

        location /oauth/ {
            proxy_pass http://portal.hi.bocsys.cn/security-common-api/oauth/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
