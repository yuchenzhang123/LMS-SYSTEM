# rcrms 单机部署配置
# 部署位置：/etc/nginx/conf.d/rcrms.conf

server {
    listen 80;
    server_name _;  # 替换为实际域名或 IP

    access_log /var/log/nginx/rcrms-access.log;
    error_log /var/log/nginx/rcrms-error.log;

    client_max_body_size 100M;

    # 前端静态资源
    location / {
        root /var/www/rcrms/dist;
        try_files $uri $uri/ /index.html;
        index index.html;

        # SSO 登录地址运行时注入

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # SSO 认证服务
    location /ssoservice/ {
        proxy_pass http://sso-server:8098;  # 替换为实际 SSO 地址
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
